<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Parallax — auditable arXiv literature sets, built by your agent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfcff"/>
      <stop offset="0.55" stop-color="#eef3ff"/>
      <stop offset="1" stop-color="#dde8ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.14" cy="0.5" r="0.32">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <symbol id="cube" viewBox="0 0 64 64">
      <polygon points="32,6 54.5,19 32,32 9.5,19" fill="#8fb4ff"/>
      <polygon points="54.5,19 54.5,45 32,58 32,32" fill="#4a7dea"/>
      <polygon points="9.5,19 32,32 32,58 9.5,45" fill="#2554c7"/>
    </symbol>
    <symbol id="ghost" viewBox="0 0 64 64">
      <polygon points="32,6 54.5,19 32,32 9.5,19 32,6 32,32 54.5,45 32,58 9.5,45 9.5,19" fill="none" stroke="#4a7dea" stroke-width="1.2" stroke-linejoin="round"/>
      <polyline points="54.5,19 54.5,45" fill="none" stroke="#4a7dea" stroke-width="1.2"/>
    </symbol>
  </defs>

  <rect x="0.5" y="0.5" width="1279" height="359" rx="28" fill="url(#bg)" stroke="#cfdcfb"/>
  <rect width="1280" height="360" rx="28" fill="url(#glow)"/>

  <!-- Layered ghost cubes drifting right: the "parallax" of the name. -->
  <g opacity="0.22">
    <use href="#ghost" x="900" y="36" width="150" height="150"/>
    <use href="#ghost" x="1060" y="150" width="120" height="120"/>
    <use href="#ghost" x="960" y="210" width="90" height="90"/>
    <use href="#ghost" x="1150" y="40" width="70" height="70"/>
  </g>
  <g opacity="0.12">
    <use href="#ghost" x="820" y="170" width="70" height="70"/>
    <use href="#ghost" x="1190" y="250" width="56" height="56"/>
  </g>

  <!-- A small set graph: corpus → filters → union → screening. -->
  <g transform="translate(220 0)">
    <g stroke="#4a7dea" stroke-opacity="0.45" stroke-width="2" fill="none">
      <path d="M690 180 H730 M730 180 V130 H770 M730 180 V230 H770 M830 130 H860 V180 H890 M830 230 H860 V180"/>
    </g>
    <g fill="#ffffff" fill-opacity="0.85" stroke="#4a7dea" stroke-opacity="0.55" stroke-width="1.5">
      <rect x="640" y="166" width="50" height="28" rx="14"/>
      <rect x="770" y="116" width="60" height="28" rx="8"/>
      <rect x="770" y="216" width="60" height="28" rx="8"/>
      <rect x="890" y="166" width="60" height="28" rx="8"/>
    </g>
  </g>

  <use href="#cube" x="96" y="92" width="176" height="176"/>

  <text x="312" y="168" fill="#0f1f4d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-1.5">Parallax</text>
  <text x="316" y="216" fill="#34508f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="500">Auditable arXiv literature sets, built by your agent</text>
  <text x="316" y="256" fill="#6a80b4" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="18">harvest · filter · screen · classify · export</text>
</svg>
